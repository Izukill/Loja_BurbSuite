<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja Laboratório</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>


  <div class="notice">Laboratório Burb Suite</div>

  <header class="shell"><a class="brand" href="/">Loja Laboratório</a><span class="tag">Compre Agora!</span></header>


  <main class="shell">
    <section class="intro">
      <p class="eyebrow">CATÁLOGO</p>

      <h1>Loja<br>Laboratório</h1>

      <p>Explore os produtos e acompanhe cada requisição com o Burp Suite.</p>

    </section>

    <form id="search-form" class="search-panel">
      <div class="field"><label for="search">O que você procura?</label><input id="search" name="q" placeholder="Experimente buscar por Teclado" maxlength="200" autocomplete="off"></div>
      <div class="field"><label for="mode">Versão da busca</label><select id="mode" name="modo"><option value="vulneravel">Vulnerável</option><option value="corrigido">Corrigida (SQL parametrizado)</option></select></div>
      <button type="submit">Buscar produtos ↗</button>
    </form>

    <div class="section-heading"><h2>Catálogo de produtos</h2><p id="status" role="status" aria-live="polite">Carregando…</p></div>

    <section class="purchase-settings" aria-label="Configuração das compras">
      <div class="field">
        <label for="purchase-mode">Versão da compra</label>
        <select id="purchase-mode">
          <option value="vulneravel">Vulnerável (preço do cliente)</option>
          <option value="corrigido">Corrigida (preço do banco)</option>
        </select>
      </div>
      <p>Compra simulada. Este seletor é independente da versão da busca.</p>
    </section>
    <section id="products" class="grid" aria-label="Produtos"></section>
  </main>


  <footer class="shell">Loja Laboratório·</footer>
</body>
</html>
